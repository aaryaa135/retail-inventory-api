services:
  - type: web
    name: retail-inventory-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AUTO_CREATE_TABLES
        value: true
      - key: PYTHON_VERSION
        value: 3.11.0
# No database — uses sqlite fallback (no bank needed). For Postgres use Neon/Supabase free URL:
#  - key: DATABASE_URL
#    value: postgresql://user:pass@ep-xxx.neon.tech/retail
