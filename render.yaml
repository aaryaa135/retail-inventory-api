services:
  - type: web
    name: retail-inventory-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: retail-db
          property: connectionString
      - key: AUTO_CREATE_TABLES
        value: false
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: retail-db
    plan: free
